[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = test_*.py
testpaths = apix/tests
addopts =
    --strict-markers
    --disable-warnings
    -ra
markers =
    integration: requires PostgreSQL and Redis
    slow: long-running statistical or browser test
filterwarnings =
    ignore::DeprecationWarning:celery.*
